<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" type="module" defer></script>
</head>
<body>
  <div id="key-counter" aria-label="Key inventory"></div>
  <div id="money-counter">coins: 0</div>
  <div id="floor-counter">floor: 1</div>
  <div id="shop-hint" hidden>press space to open shop</div>
  <game>
    <div id="game-grid"></div>
    <div id="warning-overlay" aria-hidden="true"></div>
    <div id="patrol-overlay" aria-hidden="true"></div>
    <div id="player-overlay" aria-hidden="true"></div>
  </game>
  <div id="game-over-modal" aria-live="polite" hidden>
    <div id="game-over-dialog">
      <div id="game-over-title">game over</div>
      <div id="game-over-score">score: <span id="final-score">0</span></div>
      <div id="game-over-retry">press space to try again</div>
    </div>
  </div>
  <div id="pause-modal" aria-live="polite" hidden>
    <div id="pause-dialog">
      <div id="pause-title">paused</div>
      <div id="pause-retry">press space to resume</div>
    </div>
  </div>
  <div id="shop-modal" aria-live="polite" hidden>
    <div id="shop-dialog">
      <div id="shop-title">shop</div>
      <div id="shop-retry">press space to close</div>
      <div id="shop-actions">
        <button type="button" id="buy-teleporter">teleporter</button>
        <button type="button" id="buy-drill">drill</button>
        <button type="button" id="buy-recall">recall</button>
        <button type="button" id="buy-joker-safety-view">peek</button>
      </div>
      <div id="bind-prompt"></div>
    </div>
  </div>
  <div id="mobile-controls" aria-label="Movement controls">
    <button type="button" data-direction="up" aria-label="Move up"></button>
    <button type="button" data-direction="right" aria-label="Move right"></button>
    <button type="button" data-direction="left" aria-label="Move left"></button>
    <button type="button" data-direction="down" aria-label="Move down"></button>
  </div>
  <div id="mobile-item-controls" aria-label="Item controls"></div>
</body>
</html>
